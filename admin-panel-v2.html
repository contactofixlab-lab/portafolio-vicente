<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Portafolio Vicente</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --bg-dark: #0f172a;
            --bg-card: rgba(15, 23, 42, 0.8);
            --bg-card-light: rgba(30, 41, 59, 0.6);
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --accent: #10b981;
            --accent-danger: #ef4444;
            --border: rgba(51, 65, 85, 0.5);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a2847 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ==================== LOGIN SCREEN ==================== */
        .login-wrapper {
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.3s ease-out;
        }

        .login-card {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-card-light) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        .login-icon {
            font-size: 4em;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        .login-title {
            font-size: 2em;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-subtitle {
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(51, 65, 85, 0.3);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.95em;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            background: rgba(51, 65, 85, 0.5);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .login-error {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            margin-bottom: 20px;
            display: none;
            font-size: 0.85em;
        }

        .login-error.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        /* ==================== APP CONTAINER ==================== */
        .app-container {
            display: none;
            width: 100%;
            max-width: 1400px;
            height: 100vh;
            gap: 0;
            animation: fadeIn 0.3s ease-out;
            background: var(--bg-dark);
            border-radius: 20px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .app-container.active {
            display: flex;
        }

        /* ==================== SIDEBAR ==================== */
        .sidebar {
            width: 200px;
            background: linear-gradient(180deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.05) 100%);
            border-right: 1px solid var(--border);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1em;
            font-weight: 700;
        }

        .sidebar-title span {
            font-size: 1.3em;
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75em;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .sidebar-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .sidebar-link {
            padding: 12px 12px;
            background: none;
            border: 1px solid transparent;
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            font-size: 0.9em;
            text-align: left;
            width: 100%;
        }

        .sidebar-link:hover {
            background: rgba(102, 126, 234, 0.1);
            color: var(--text-primary);
        }

        .sidebar-link.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3) 0%, rgba(118, 75, 162, 0.2) 100%);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* ==================== MAIN CONTENT ==================== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-dark);
            overflow: hidden;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(90deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
        }

        .content-title {
            font-size: 1.2em;
            font-weight: 700;
        }

        .btn-new {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .btn-new:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .content-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 8px;
            align-content: start;
        }

        /* ==================== CARDS ==================== */
        .item-card {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-card-light) 100%);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            transition: all 0.3s;
            cursor: default;
        }

        .item-card:hover {
            border-color: var(--primary);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .card-title {
            font-weight: 700;
            font-size: 0.9em;
            margin-bottom: 4px;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }

        .card-meta {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-bottom: 6px;
        }

        .meta-line {
            font-size: 0.75em;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            line-height: 1.1;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75em;
            font-weight: 600;
            width: fit-content;
        }

        .badge-primary {
            background: rgba(102, 126, 234, 0.2);
            color: #a5b4fc;
            border: 1px solid rgba(102, 126, 234, 0.3);
        }

        .badge-success {
            background: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-warning {
            background: rgba(245, 158, 11, 0.2);
            color: #fcd34d;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .card-actions {
            display: flex;
            gap: 4px;
            justify-content: flex-end;
            padding-top: 6px;
            border-top: 1px solid var(--border);
        }

        .btn-sm {
            padding: 4px 8px;
            border: 1px solid var(--border);
            background: rgba(51, 65, 85, 0.3);
            color: var(--text-secondary);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7em;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-sm:hover {
            background: rgba(102, 126, 234, 0.2);
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-sm-delete:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            color: #fca5a5;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            font-size: 1.1em;
        }

        /* ==================== MODAL ==================== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            animation: fadeIn 0.2s ease-out;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-card-light) 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.3s ease-out;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(90deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.05) 100%);
        }

        .modal-header h2 {
            font-size: 1.3em;
            margin: 0;
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.3s;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-close:hover {
            color: var(--text-primary);
            background: rgba(102, 126, 234, 0.1);
            border-radius: 6px;
        }

        .modal-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-footer {
            display: flex;
            gap: 12px;
            padding: 20px;
            border-top: 1px solid var(--border);
            justify-content: flex-end;
            background: linear-gradient(90deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.02) 100%);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            background: rgba(51, 65, 85, 0.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(51, 65, 85, 0.5);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.85em;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: rgba(51, 65, 85, 0.3);
            color: var(--text-secondary);
            padding: 10px 20px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .btn-secondary:hover {
            background: rgba(51, 65, 85, 0.5);
            color: var(--text-primary);
        }

        /* ==================== SEARCH ==================== */
        .search-box {
            padding: 0 12px;
            margin-bottom: 8px;
        }

        .search-box input {
            width: 100%;
            padding: 8px 10px;
            background: rgba(51, 65, 85, 0.3);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.85em;
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
        }

        /* ==================== ANIMATIONS ==================== */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes slideDown {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        /* ==================== SCROLLBAR ==================== */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.3);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(102, 126, 234, 0.5);
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
                max-height: 100vh;
            }

            .sidebar {
                width: 100%;
                flex-direction: row;
                padding: 12px;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }

            .sidebar-header {
                display: none;
            }

            .sidebar-menu {
                flex-direction: row;
                gap: 4px;
            }

            .sidebar-link {
                padding: 8px 12px;
                font-size: 0.8em;
                flex: 1;
            }

            .content-body {
                grid-template-columns: 1fr;
            }

            .modal-content {
                width: 95%;
            }
        }
    </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-wrapper" class="login-wrapper">
    <div class="login-card">
        <div class="login-icon">🔐</div>
        <h1 class="login-title">Admin Panel</h1>
        <p class="login-subtitle">Consola Privada</p>
        <div class="login-error" id="login-error"></div>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="Ingresa la contraseña" required>
            </div>
            <button type="submit" class="btn-login">Entrar</button>
        </form>
    </div>
</div>

<!-- APP CONTAINER -->
<div id="app-container" class="app-container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">
                <span>⚙️</span>
                <div>Admin</div>
            </div>
            <button class="btn-logout" onclick="handleLogout()">Salir</button>
        </div>
        <ul class="sidebar-menu">
            <li><button class="sidebar-link active" onclick="switchSection('proyectos')">🎨 Proyectos</button></li>
            <li><button class="sidebar-link" onclick="switchSection('trayectoria')">📍 Trayectoria</button></li>
            <li><button class="sidebar-link" onclick="switchSection('habilidades')">💻 Habilidades</button></li>
            <li><button class="sidebar-link" onclick="switchSection('certificados')">🎓 Certificados</button></li>
        </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- HEADER -->
        <div class="content-header">
            <h1 class="content-title" id="content-title">Proyectos</h1>
            <button class="btn-new" onclick="openModal('proyectos', null)">➕ Nuevo</button>
        </div>

        <!-- SEARCH -->
        <div class="search-box">
            <input type="text" placeholder="🔍 Buscar..." onkeyup="filterCards(event)">
        </div>

        <!-- CONTENT BODY -->
        <div class="content-body" id="content-body"></div>
    </main>
</div>

<!-- MODAL -->
<div id="modal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modal-title">Nuevo Proyecto</h2>
            <button class="btn-close" onclick="closeModal()">✕</button>
        </div>
        <form onsubmit="handleSubmit(event)">
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button>
                <button type="submit" class="btn-primary">Guardar</button>
            </div>
        </form>
    </div>
</div>

// ==================== LOGIN ====================
function handleLogin(event) {
  event.preventDefault();
  const password = document.getElementById('password').value;
  if (password === ADMIN_PASSWORD) {
    document.getElementById('login-wrapper').style.display = 'none';
    document.getElementById('app-container').classList.add('active');
    sessionStorage.setItem('adminLoggedIn', 'true');
    loadAllData();
    renderCards();
  } else {
    const errorEl = document.getElementById('login-error');
    errorEl.textContent = '❌ Contraseña incorrecta';
    errorEl.classList.add('show');
    document.getElementById('password').value = '';
    setTimeout(() => errorEl.classList.remove('show'), 3000);
  }
}

function handleLogout() {
  if (confirm('¿Estás seguro que quieres salir?')) {
    sessionStorage.removeItem('adminLoggedIn');
    document.getElementById('login-wrapper').style.display = 'flex';
    document.getElementById('app-container').classList.remove('active');
    document.getElementById('password').value = '';
  }
}

window.addEventListener('load', () => {
  if (sessionStorage.getItem('adminLoggedIn') === 'true') {
    document.getElementById('login-wrapper').style.display = 'none';
    document.getElementById('app-container').classList.add('active');
    loadAllData();
    renderCards();
  }
});

// ==================== DATA ====================
function loadAllData() {
  allData.proyectos = JSON.parse(localStorage.getItem('portafolio_projects')) || [];
  allData.trayectoria = JSON.parse(localStorage.getItem('portafolio_experiences')) || [];
  allData.habilidades = JSON.parse(localStorage.getItem('portafolio_skills')) || [];
  allData.certificados = JSON.parse(localStorage.getItem('portafolio_certificates')) || [];
}

function renderCards() {
  const container = document.getElementById('content-body');
  let items = [];

  if (currentSection === 'proyectos') items = allData.proyectos;
  else if (currentSection === 'trayectoria') items = allData.trayectoria;
  else if (currentSection === 'habilidades') items = allData.habilidades;
  else if (currentSection === 'certificados') items = allData.certificados;

  if (items.length === 0) {
    container.innerHTML = '<div class="empty-state">No hay items aún 📭</div>';
    return;
  }

  container.innerHTML = items.map(item => {
    let cardContent = '';
    if (currentSection === 'proyectos') {
      cardContent = `
        <div class="card-title">${item.title}</div>
        <div class="card-meta">
          <div class="meta-line"><span>${item.company}</span> <span class="badge badge-primary">${item.type}</span></div>
          <div class="meta-line"><span>${item.year}</span> <span class="badge ${item.status === 'Terminado' ? 'badge-success' : 'badge-warning'}">${item.status}</span></div>
        </div>
      `;
    } else if (currentSection === 'trayectoria') {
      cardContent = `
        <div class="card-title">${item.title}</div>
        <div class="card-meta">
          <div class="meta-line"><span>${item.company}</span></div>
          <div class="meta-line"><span>${item.startDate}</span> <span class="badge badge-primary">${item.badge}</span></div>
        </div>
      `;
    } else if (currentSection === 'habilidades') {
      cardContent = `
        <div class="card-title">${item.name}</div>
        <div class="card-meta">
          <div class="meta-line"><span>${item.category}</span></div>
          <div class="meta-line"><span>${item.level || 'N/A'}</span></div>
        </div>
      `;
    } else if (currentSection === 'certificados') {
      cardContent = `
        <div class="card-title">${item.title}</div>
        <div class="card-meta">
          <div class="meta-line"><span>${item.issuer}</span></div>
          <div class="meta-line"><span>Año: ${item.year}</span></div>
        </div>
      `;
    }

    return `
      <div class="item-card">
        ${cardContent}
        <div class="card-actions">
          <button class="btn-sm" onclick="openModal('${currentSection}', '${item.id}')">✏️ Editar</button>
          <button class="btn-sm btn-sm-delete" onclick="deleteItem('${currentSection}', '${item.id}')">🗑️ Eliminar</button>
        </div>
      </div>
    `;
  }).join('');
}

// ==================== NAVIGATION ====================
function switchSection(section) {
  currentSection = section;
  const titles = { proyectos: 'Proyectos', trayectoria: 'Trayectoria', habilidades: 'Habilidades', certificados: 'Certificados' };
  document.getElementById('content-title').textContent = titles[section];
  document.querySelectorAll('.sidebar-link').forEach(link => link.classList.remove('active'));
  event.target.classList.add('active');
  renderCards();
}

// ==================== MODAL ====================
function openModal(type, id) {
  currentEditId = id;
  const modal = document.getElementById('modal');
  const title = document.getElementById('modal-title');
  const body = document.getElementById('modal-body');

  let isEdit = !!id;
  let data = null;

  if (isEdit) {
    if (type === 'proyectos') data = allData.proyectos.find(p => p.id == id);
    else if (type === 'trayectoria') data = allData.trayectoria.find(e => e.id == id);
    else if (type === 'habilidades') data = allData.habilidades.find(s => s.id == id);
    else if (type === 'certificados') data = allData.certificados.find(c => c.id == id);
  }

  const typeNames = { proyectos: 'Proyecto', trayectoria: 'Experiencia', habilidades: 'Habilidad', certificados: 'Certificado' };
  title.textContent = (isEdit ? 'Editar ' : 'Nuevo ') + typeNames[type];
  body.innerHTML = getFormHTML(type, data);
  modal.classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
  currentEditId = null;
}

function getFormHTML(type, data) {
  const common = (label, id, value = '') => `
    <div class="form-group">
      <label>${label}</label>
      <input type="text" id="${id}" value="${value || ''}" required>
    </div>
  `;

  if (type === 'proyectos') {
    return `
      ${common('Título', 'form-title', data?.title)}
      ${common('Empresa', 'form-company', data?.company)}
      <div class="form-group">
        <label>Descripción</label>
        <textarea id="form-description" required>${data?.description || ''}</textarea>
      </div>
      <div class="form-group">
        <label>Tipo</label>
        <select id="form-type">
          <option value="App" ${data?.type === 'App' ? 'selected' : ''}>App</option>
          <option value="Web" ${data?.type === 'Web' ? 'selected' : ''}>Web</option>
        </select>
      </div>
      <div class="form-group">
        <label>Estado</label>
        <select id="form-status">
          <option value="Terminado" ${data?.status === 'Terminado' ? 'selected' : ''}>Terminado</option>
          <option value="En Desarrollo" ${data?.status === 'En Desarrollo' ? 'selected' : ''}>En Desarrollo</option>
        </select>
      </div>
      ${common('Año', 'form-year', data?.year)}
      ${common('GitHub URL', 'form-github', data?.github)}
      ${common('Demo URL', 'form-demo', data?.demo)}
    `;
  } else if (type === 'trayectoria') {
    return `
      ${common('Título', 'form-title', data?.title)}
      ${common('Empresa', 'form-company', data?.company)}
      <div class="form-group">
        <label>Descripción</label>
        <textarea id="form-description">${data?.description || ''}</textarea>
      </div>
      ${common('Inicio (YYYY-MM-DD)', 'form-startDate', data?.startDate)}
      ${common('Fin (YYYY-MM-DD)', 'form-endDate', data?.endDate)}
      <div class="form-group">
        <label>Badge</label>
        <select id="form-badge">
          <option value="Actual" ${data?.badge === 'Actual' ? 'selected' : ''}>Actual</option>
          <option value="Liderazgo" ${data?.badge === 'Liderazgo' ? 'selected' : ''}>Liderazgo</option>
          <option value="Estrategia" ${data?.badge === 'Estrategia' ? 'selected' : ''}>Estrategia</option>
          <option value="Aprendizaje" ${data?.badge === 'Aprendizaje' ? 'selected' : ''}>Aprendizaje</option>
        </select>
      </div>
    `;
  } else if (type === 'habilidades') {
    return `
      ${common('Nombre', 'form-name', data?.name)}
      ${common('Categoría', 'form-category', data?.category)}
      ${common('Nivel', 'form-level', data?.level)}
      ${common('Imagen URL', 'form-image', data?.image)}
    `;
  } else if (type === 'certificados') {
    return `
      ${common('Título', 'form-title', data?.title)}
      ${common('Emisor', 'form-issuer', data?.issuer)}
      ${common('Año', 'form-year', data?.year)}
      <div class="form-group">
        <label>Descripción</label>
        <textarea id="form-description">${data?.description || ''}</textarea>
      </div>
      ${common('Imagen URL', 'form-image', data?.image)}
    `;
  }
}

function handleSubmit(event) {
  event.preventDefault();
  const type = currentSection;
  let formData = {};

  if (type === 'proyectos') {
    formData = {
      id: currentEditId || Date.now(),
      title: document.getElementById('form-title').value,
      company: document.getElementById('form-company').value,
      description: document.getElementById('form-description').value,
      type: document.getElementById('form-type').value,
      status: document.getElementById('form-status').value,
      year: parseInt(document.getElementById('form-year').value),
      github: document.getElementById('form-github').value,
      demo: document.getElementById('form-demo').value,
      image: ''
    };

    if (currentEditId) {
      const idx = allData.proyectos.findIndex(p => p.id == currentEditId);
      allData.proyectos[idx] = { ...allData.proyectos[idx], ...formData };
    } else {
      allData.proyectos.push(formData);
    }
    localStorage.setItem('portafolio_projects', JSON.stringify(allData.proyectos));
  } else if (type === 'trayectoria') {
    formData = {
      id: currentEditId || Date.now(),
      title: document.getElementById('form-title').value,
      company: document.getElementById('form-company').value,
      description: document.getElementById('form-description').value,
      startDate: document.getElementById('form-startDate').value,
      endDate: document.getElementById('form-endDate').value,
      badge: document.getElementById('form-badge').value
    };

    if (currentEditId) {
      const idx = allData.trayectoria.findIndex(e => e.id == currentEditId);
      allData.trayectoria[idx] = { ...allData.trayectoria[idx], ...formData };
    } else {
      allData.trayectoria.push(formData);
    }
    localStorage.setItem('portafolio_experiences', JSON.stringify(allData.trayectoria));
  } else if (type === 'habilidades') {
    formData = {
      id: currentEditId || Date.now(),
      name: document.getElementById('form-name').value,
      category: document.getElementById('form-category').value,
      level: document.getElementById('form-level').value,
      image: document.getElementById('form-image').value
    };

    if (currentEditId) {
      const idx = allData.habilidades.findIndex(s => s.id == currentEditId);
      allData.habilidades[idx] = { ...allData.habilidades[idx], ...formData };
    } else {
      allData.habilidades.push(formData);
    }
    localStorage.setItem('portafolio_skills', JSON.stringify(allData.habilidades));
  } else if (type === 'certificados') {
    formData = {
      id: currentEditId || Date.now(),
      title: document.getElementById('form-title').value,
      issuer: document.getElementById('form-issuer').value,
      year: parseInt(document.getElementById('form-year').value),
      description: document.getElementById('form-description').value,
      image: document.getElementById('form-image').value
    };

    if (currentEditId) {
      const idx = allData.certificados.findIndex(c => c.id == currentEditId);
      allData.certificados[idx] = { ...allData.certificados[idx], ...formData };
    } else {
      allData.certificados.push(formData);
    }
    localStorage.setItem('portafolio_certificates', JSON.stringify(allData.certificados));
  }

  window.dispatchEvent(new CustomEvent('portafolioDataUpdated', { detail: { message: 'Datos actualizados' } }));
  closeModal();
  loadAllData();
  renderCards();
}

function deleteItem(type, id) {
  if (!confirm('¿Estás seguro?')) return;

  if (type === 'proyectos') {
    allData.proyectos = allData.proyectos.filter(p => p.id != id);
    localStorage.setItem('portafolio_projects', JSON.stringify(allData.proyectos));
  } else if (type === 'trayectoria') {
    allData.trayectoria = allData.trayectoria.filter(e => e.id != id);
    localStorage.setItem('portafolio_experiences', JSON.stringify(allData.trayectoria));
  } else if (type === 'habilidades') {
    allData.habilidades = allData.habilidades.filter(s => s.id != id);
    localStorage.setItem('portafolio_skills', JSON.stringify(allData.habilidades));
  } else if (type === 'certificados') {
    allData.certificados = allData.certificados.filter(c => c.id != id);
    localStorage.setItem('portafolio_certificates', JSON.stringify(allData.certificados));
  }

  window.dispatchEvent(new CustomEvent('portafolioDataUpdated', { detail: { message: 'Datos eliminados' } }));
  loadAllData();
  renderCards();
}

function filterCards(event) {
  const searchTerm = event.target.value.toLowerCase();
  const cards = document.querySelectorAll('.item-card');
  cards.forEach(card => {
    const text = card.textContent.toLowerCase();
    card.style.display = text.includes(searchTerm) ? '' : 'none';
  });
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});
</script>
