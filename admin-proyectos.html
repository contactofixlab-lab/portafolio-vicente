<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Proyectos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            margin-bottom: 30px;
        }

        header h1 {
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        header p {
            color: #666;
            font-size: 0.95em;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }

        .panel {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            padding: 30px;
        }

        .panel h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #667eea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95em;
            transition: border-color 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.95em;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #333;
            width: 100%;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .projects-list {
            display: grid;
            gap: 15px;
        }

        .project-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .project-card:hover {
            border-color: #667eea;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .project-card.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .project-card h3 {
            color: inherit;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .project-card p {
            font-size: 0.85em;
            opacity: 0.8;
            margin-bottom: 10px;
        }

        .project-meta {
            display: flex;
            gap: 15px;
            font-size: 0.8em;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .badge {
            background: rgba(0,0,0,0.1);
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
        }

        .project-card.active .badge {
            background: rgba(255,255,255,0.2);
        }

        .project-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-edit, .btn-delete, .btn-export {
            flex: 1;
            padding: 8px 12px;
            font-size: 0.8em;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-edit {
            background: #3b82f6;
            color: white;
        }

        .btn-edit:hover {
            background: #2563eb;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        .btn-export {
            background: #10b981;
            color: white;
        }

        .btn-export:hover {
            background: #059669;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state p {
            margin-bottom: 20px;
            font-size: 1.1em;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .toolbar button {
            padding: 10px 20px;
            font-size: 0.9em;
            width: auto;
            margin: 0;
        }

        .export-section {
            background: #f3f4f6;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .export-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1em;
        }

        .export-buttons {
            display: grid;
            gap: 10px;
        }

        .export-buttons button {
            padding: 12px;
            width: 100%;
            margin: 0;
            font-size: 0.95em;
        }

        .feedback {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        .feedback.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box .number {
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-box .label {
            font-size: 0.8em;
            opacity: 0.9;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 0.95em;
        }

        @media (max-width: 1024px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 Panel de Administración de Proyectos</h1>
            <p>Gestiona, crea y edita tus proyectos fácilmente</p>
        </header>

        <div class="layout">
            <!-- Panel izquierdo: Formulario -->
            <div class="panel">
                <h2>📝 Nuevo Proyecto</h2>
                <form id="projectForm">
                    <div class="form-group">
                        <label>Nombre del Proyecto *</label>
                        <input type="text" id="title" placeholder="Ej: Mi Awesome App" required>
                    </div>

                    <div class="form-group">
                        <label>Descripción *</label>
                        <textarea id="description" placeholder="Descripción breve del proyecto" required></textarea>
                    </div>

                    <div class="form-group">
                        <label>Empresa *</label>
                        <select id="company" required>
                            <option value="">Selecciona empresa</option>
                            <option value="Iencinas">Iencinas</option>
                            <option value="Yencinas">Yencinas</option>
                            <option value="Constructora PDS">Constructora PDS</option>
                            <option value="Proyecto Personal">Proyecto Personal</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Tipo *</label>
                        <select id="type" required>
                            <option value="">Selecciona tipo</option>
                            <option value="App">App</option>
                            <option value="Web">Web</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Estado *</label>
                        <select id="status" required>
                            <option value="Terminado">Terminado</option>
                            <option value="En Desarrollo">En Desarrollo</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Año de Desarrollo *</label>
                        <input type="number" id="year" value="2024" required>
                    </div>

                    <div class="form-group">
                        <label>Ruta de Imagen *</label>
                        <input type="text" id="image" placeholder="/projects/logo.png" required>
                    </div>

                    <div class="form-group">
                        <label>URL GitHub</label>
                        <input type="text" id="github" placeholder="https://github.com/...">
                    </div>

                    <div class="form-group">
                        <label>URL Demo</label>
                        <input type="text" id="demo" placeholder="https://...">
                    </div>

                    <button type="submit" class="btn-primary">➕ Agregar Proyecto</button>
                    <button type="reset" class="btn-secondary">🔄 Limpiar Formulario</button>
                </form>

                <div class="export-section">
                    <h3>📊 Exportar Datos</h3>
                    <div class="export-buttons">
                        <button onclick="exportJSON()" class="btn-primary">📋 JSON</button>
                        <button onclick="exportCSV()" class="btn-primary">📊 CSV</button>
                        <button onclick="copyToClipboard()" class="btn-primary">📌 Copiar</button>
                    </div>
                </div>
            </div>

            <!-- Panel derecho: Lista de proyectos -->
            <div class="panel">
                <h2>📚 Mis Proyectos</h2>

                <div class="stats">
                    <div class="stat-box">
                        <div class="number" id="totalProjects">0</div>
                        <div class="label">Total</div>
                    </div>
                    <div class="stat-box">
                        <div class="number" id="totalApps">0</div>
                        <div class="label">Apps</div>
                    </div>
                    <div class="stat-box">
                        <div class="number" id="totalFinished">0</div>
                        <div class="label">Terminados</div>
                    </div>
                </div>

                <div class="toolbar">
                    <button onclick="sortByName()">📝 A-Z</button>
                    <button onclick="sortByStatus()">✓ Estado</button>
                    <button onclick="sortByType()">🏷️ Tipo</button>
                    <button onclick="clearAll()" style="background: #ef4444; color: white;">🗑️ Limpiar Todo</button>
                </div>

                <div class="search-box">
                    <input type="text" id="searchBox" placeholder="🔍 Buscar proyectos..." onkeyup="filterProjects()">
                </div>

                <div class="projects-list" id="projectsList">
                    <div class="empty-state">
                        <p>📭 No hay proyectos aún</p>
                        <p style="font-size: 0.9em; color: #bbb;">Crea tu primer proyecto en el formulario</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="feedback" id="feedback"></div>

    <script>
        // Datos en localStorage
        const STORAGE_KEY = 'portafolio_proyectos';

        // Cargar datos al iniciar
        document.addEventListener('DOMContentLoaded', () => {
            loadProjects();
            document.getElementById('projectForm').addEventListener('submit', handleAddProject);
        });

        function getProjects() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        function saveProjects(projects) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
        }

        function handleAddProject(e) {
            e.preventDefault();

            const projects = getProjects();
            const newProject = {
                id: Date.now(),
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                company: document.getElementById('company').value,
                type: document.getElementById('type').value,
                status: document.getElementById('status').value,
                year: parseInt(document.getElementById('year').value),
                image: document.getElementById('image').value,
                github: document.getElementById('github').value || '',
                demo: document.getElementById('demo').value || ''
            };

            projects.push(newProject);
            saveProjects(projects);

            document.getElementById('projectForm').reset();
            loadProjects();
            mostrarFeedback('✅ Proyecto agregado exitosamente');
        }

        function loadProjects() {
            const projects = getProjects();
            const list = document.getElementById('projectsList');

            if (projects.length === 0) {
                list.innerHTML = '<div class="empty-state"><p>📭 No hay proyectos aún</p><p style="font-size: 0.9em; color: #bbb;">Crea tu primer proyecto en el formulario</p></div>';
                updateStats(projects);
                return;
            }

            list.innerHTML = projects.map(project => `
                <div class="project-card" onclick="selectProject(${project.id})">
                    <h3>
                        ${project.title}
                        <span style="font-size: 0.8em; opacity: 0.7;">#${project.id}</span>
                    </h3>
                    <p>${project.description}</p>
                    <div class="project-meta">
                        <span class="badge">${project.company}</span>
                        <span class="badge">${project.type}</span>
                        <span class="badge">${project.status}</span>
                        <span class="badge">${project.year}</span>
                    </div>
                    <div class="project-actions">
                        <button class="btn-edit" onclick="editProject(event, ${project.id})">✏️ Editar</button>
                        <button class="btn-delete" onclick="deleteProject(event, ${project.id})">🗑️ Eliminar</button>
                        <button class="btn-export" onclick="viewProject(event, ${project.id})">👁️ Ver</button>
                    </div>
                </div>
            `).join('');

            updateStats(projects);
        }

        function updateStats(projects) {
            document.getElementById('totalProjects').textContent = projects.length;
            document.getElementById('totalApps').textContent = projects.filter(p => p.type === 'App').length;
            document.getElementById('totalFinished').textContent = projects.filter(p => p.status === 'Terminado').length;
        }

        function deleteProject(e, id) {
            e.stopPropagation();
            if (confirm('¿Estás seguro de que quieres eliminar este proyecto?')) {
                const projects = getProjects();
                const filtered = projects.filter(p => p.id !== id);
                saveProjects(filtered);
                loadProjects();
                mostrarFeedback('🗑️ Proyecto eliminado');
            }
        }

        function editProject(e, id) {
            e.stopPropagation();
            const projects = getProjects();
            const project = projects.find(p => p.id === id);

            if (project) {
                document.getElementById('title').value = project.title;
                document.getElementById('description').value = project.description;
                document.getElementById('company').value = project.company;
                document.getElementById('type').value = project.type;
                document.getElementById('status').value = project.status;
                document.getElementById('year').value = project.year;
                document.getElementById('image').value = project.image;
                document.getElementById('github').value = project.github;
                document.getElementById('demo').value = project.demo;

                deleteProject(e, id);
                document.querySelector('.panel h2').textContent = '✏️ Editando: ' + project.title;
            }
        }

        function viewProject(e, id) {
            e.stopPropagation();
            const projects = getProjects();
            const project = projects.find(p => p.id === id);
            alert(`${project.title}\n\n${project.description}\n\nGitHub: ${project.github}\nDemo: ${project.demo}`);
        }

        function filterProjects() {
            const search = document.getElementById('searchBox').value.toLowerCase();
            const projects = getProjects();
            const filtered = projects.filter(p =>
                p.title.toLowerCase().includes(search) ||
                p.company.toLowerCase().includes(search) ||
                p.description.toLowerCase().includes(search)
            );

            if (filtered.length === 0) {
                document.getElementById('projectsList').innerHTML = '<div class="empty-state"><p>No se encontraron proyectos</p></div>';
                return;
            }

            loadProjectsFromList(filtered);
        }

        function loadProjectsFromList(projects) {
            const list = document.getElementById('projectsList');
            list.innerHTML = projects.map(project => `
                <div class="project-card">
                    <h3>
                        ${project.title}
                        <span style="font-size: 0.8em; opacity: 0.7;">#${project.id}</span>
                    </h3>
                    <p>${project.description}</p>
                    <div class="project-meta">
                        <span class="badge">${project.company}</span>
                        <span class="badge">${project.type}</span>
                        <span class="badge">${project.status}</span>
                        <span class="badge">${project.year}</span>
                    </div>
                    <div class="project-actions">
                        <button class="btn-edit" onclick="editProject(event, ${project.id})">✏️ Editar</button>
                        <button class="btn-delete" onclick="deleteProject(event, ${project.id})">🗑️ Eliminar</button>
                        <button class="btn-export" onclick="viewProject(event, ${project.id})">👁️ Ver</button>
                    </div>
                </div>
            `).join('');
        }

        function sortByName() {
            const projects = getProjects();
            projects.sort((a, b) => a.title.localeCompare(b.title));
            loadProjectsFromList(projects);
        }

        function sortByStatus() {
            const projects = getProjects();
            projects.sort((a, b) => a.status.localeCompare(b.status));
            loadProjectsFromList(projects);
        }

        function sortByType() {
            const projects = getProjects();
            projects.sort((a, b) => a.type.localeCompare(b.type));
            loadProjectsFromList(projects);
        }

        function exportJSON() {
            const projects = getProjects();
            const json = JSON.stringify(projects, null, 2);
            downloadFile(json, 'proyectos.json', 'application/json');
        }

        function exportCSV() {
            const projects = getProjects();
            let csv = 'ID,Nombre,Descripción,Empresa,Tipo,Estado,Año,Imagen,GitHub,Demo\n';
            projects.forEach(p => {
                csv += `${p.id},"${p.title}","${p.description}","${p.company}","${p.type}","${p.status}",${p.year},"${p.image}","${p.github}","${p.demo}"\n`;
            });
            downloadFile(csv, 'proyectos.csv', 'text/csv');
        }

        function copyToClipboard() {
            const projects = getProjects();
            const json = JSON.stringify(projects, null, 2);
            navigator.clipboard.writeText(json).then(() => {
                mostrarFeedback('📋 JSON copiado al portapapeles');
            });
        }

        function downloadFile(content, filename, type) {
            const blob = new Blob([content], { type });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            window.URL.revokeObjectURL(url);
            mostrarFeedback(`💾 ${filename} descargado`);
        }

        function clearAll() {
            if (confirm('⚠️ ¿Eliminar TODOS los proyectos? Esta acción no se puede deshacer.')) {
                localStorage.removeItem(STORAGE_KEY);
                loadProjects();
                mostrarFeedback('🗑️ Todos los proyectos fueron eliminados');
            }
        }

        function selectProject(id) {
            // Placeholder para seleccionar proyecto
        }

        function mostrarFeedback(mensaje) {
            const feedback = document.getElementById('feedback');
            feedback.textContent = mensaje;
            feedback.classList.add('show');
            setTimeout(() => feedback.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
