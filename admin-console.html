<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consola Admin - Portafolio Vicente</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.8em;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .header-actions button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background: rgba(255,255,255,0.2);
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .header-actions button:hover {
            background: rgba(255,255,255,0.3);
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #1e293b;
            flex-wrap: wrap;
        }

        .tab-button {
            padding: 12px 24px;
            border: none;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            font-weight: 600;
            font-size: 1em;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            position: relative;
            bottom: -2px;
        }

        .tab-button:hover {
            color: #e2e8f0;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-in;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .panel-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .panel {
            background: #1e293b;
            border-radius: 12px;
            padding: 25px;
            border: 1px solid #334155;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .panel h2 {
            color: #e2e8f0;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #667eea;
            font-size: 1.3em;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #cbd5e1;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #0f172a;
            color: #e2e8f0;
            font-family: inherit;
            font-size: 0.95em;
            transition: all 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
            background: #1e293b;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.95em;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #334155;
            color: #e2e8f0;
            width: 100%;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .items-list {
            display: grid;
            gap: 15px;
        }

        .item-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .item-card:hover {
            border-color: #667eea;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .item-card h3 {
            color: #e2e8f0;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-card p {
            font-size: 0.85em;
            color: #94a3b8;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .item-meta {
            display: flex;
            gap: 10px;
            font-size: 0.8em;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .badge {
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid rgba(102, 126, 234, 0.3);
        }

        .item-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .btn-edit, .btn-delete, .btn-view {
            flex: 1;
            padding: 8px 12px;
            font-size: 0.8em;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-edit {
            background: #3b82f6;
            color: white;
        }

        .btn-edit:hover {
            background: #2563eb;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        .btn-view {
            background: #10b981;
            color: white;
        }

        .btn-view:hover {
            background: #059669;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }

        .empty-state p {
            margin-bottom: 20px;
            font-size: 1.1em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box .number {
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-box .label {
            font-size: 0.8em;
            opacity: 0.9;
        }

        .export-section {
            background: #0f172a;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid #334155;
        }

        .export-section h3 {
            color: #e2e8f0;
            margin-bottom: 15px;
            font-size: 1em;
        }

        .export-buttons {
            display: grid;
            gap: 10px;
        }

        .export-buttons button {
            padding: 12px;
            width: 100%;
            margin: 0;
        }

        .feedback {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            display: none;
            animation: slideIn 0.3s ease-out;
            z-index: 1000;
        }

        .feedback.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #0f172a;
            color: #e2e8f0;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .toolbar button {
            padding: 10px 15px;
            font-size: 0.85em;
            width: auto;
            margin: 0;
        }

        @media (max-width: 1024px) {
            .panel-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1>⚙️ Consola Admin - Portafolio</h1>
            <div class="header-actions">
                <button onclick="exportAllData()">📊 Exportar Todo</button>
                <button onclick="importData()">📥 Importar</button>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- TABS DE NAVEGACIÓN -->
        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('proyectos')">🎨 Proyectos</button>
            <button class="tab-button" onclick="switchTab('trayectoria')">📍 Trayectoria</button>
            <button class="tab-button" onclick="switchTab('habilidades')">💻 Habilidades</button>
            <button class="tab-button" onclick="switchTab('certificados')">🎓 Certificados</button>
        </div>

        <!-- TAB: PROYECTOS -->
        <div id="proyectos" class="tab-content active">
            <div class="panel-grid">
                <!-- Formulario Proyectos -->
                <div class="panel">
                    <h2>📝 Nuevo Proyecto</h2>
                    <form id="projectForm">
                        <div class="form-group">
                            <label>Nombre *</label>
                            <input type="text" id="proj-title" required>
                        </div>
                        <div class="form-group">
                            <label>Descripción *</label>
                            <textarea id="proj-desc" required></textarea>
                        </div>
                        <div class="form-group">
                            <label>Empresa *</label>
                            <select id="proj-company" required>
                                <option>Iencinas</option>
                                <option>Yencinas</option>
                                <option>Constructora PDS</option>
                                <option>Proyecto Personal</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Tipo *</label>
                            <select id="proj-type" required>
                                <option>App</option>
                                <option>Web</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Estado *</label>
                            <select id="proj-status" required>
                                <option>Terminado</option>
                                <option>En Desarrollo</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Año *</label>
                            <input type="number" id="proj-year" value="2024" required>
                        </div>
                        <div class="form-group">
                            <label>Imagen *</label>
                            <input type="text" id="proj-image" placeholder="/projects/logo.png" required>
                        </div>
                        <div class="form-group">
                            <label>GitHub</label>
                            <input type="text" id="proj-github" placeholder="https://github.com/...">
                        </div>
                        <div class="form-group">
                            <label>Demo</label>
                            <input type="text" id="proj-demo" placeholder="https://...">
                        </div>
                        <button type="submit" class="btn-primary">➕ Agregar Proyecto</button>
                        <button type="reset" class="btn-secondary">🔄 Limpiar</button>
                    </form>
                </div>

                <!-- Lista Proyectos -->
                <div class="panel">
                    <h2>📚 Mis Proyectos</h2>
                    <div class="stats-grid" id="proyectos-stats">
                        <div class="stat-box"><div class="number" id="proj-total">0</div><div class="label">Total</div></div>
                        <div class="stat-box"><div class="number" id="proj-apps">0</div><div class="label">Apps</div></div>
                        <div class="stat-box"><div class="number" id="proj-fin">0</div><div class="label">Terminados</div></div>
                    </div>
                    <div class="search-box">
                        <input type="text" placeholder="🔍 Buscar..." onkeyup="filterProjects()">
                    </div>
                    <div class="items-list" id="proyectos-list"></div>
                </div>
            </div>
        </div>

        <!-- TAB: TRAYECTORIA -->
        <div id="trayectoria" class="tab-content">
            <div class="panel-grid">
                <!-- Formulario Trayectoria -->
                <div class="panel">
                    <h2>📝 Nueva Experiencia</h2>
                    <form id="experienceForm">
                        <div class="form-group">
                            <label>Título *</label>
                            <input type="text" id="exp-title" required>
                        </div>
                        <div class="form-group">
                            <label>Empresa *</label>
                            <input type="text" id="exp-company" required>
                        </div>
                        <div class="form-group">
                            <label>Descripción</label>
                            <textarea id="exp-desc"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Fecha Inicio *</label>
                            <input type="date" id="exp-start" required>
                        </div>
                        <div class="form-group">
                            <label>Fecha Fin</label>
                            <input type="date" id="exp-end">
                        </div>
                        <div class="form-group">
                            <label>Tipo Badge</label>
                            <select id="exp-badge">
                                <option>Actual</option>
                                <option>Entrada</option>
                                <option>Aprendizaje</option>
                                <option>Liderazgo</option>
                                <option>Estrategia</option>
                                <option>Operaciones</option>
                                <option>Sistemas</option>
                            </select>
                        </div>
                        <button type="submit" class="btn-primary">➕ Agregar</button>
                        <button type="reset" class="btn-secondary">🔄 Limpiar</button>
                    </form>
                </div>

                <!-- Lista Trayectoria -->
                <div class="panel">
                    <h2>📍 Mi Trayectoria</h2>
                    <div class="stats-grid" id="exp-stats">
                        <div class="stat-box"><div class="number" id="exp-total">0</div><div class="label">Total</div></div>
                        <div class="stat-box"><div class="number" id="exp-actual">0</div><div class="label">Actuales</div></div>
                    </div>
                    <div class="search-box">
                        <input type="text" placeholder="🔍 Buscar..." onkeyup="filterExperiences()">
                    </div>
                    <div class="items-list" id="experiences-list"></div>
                </div>
            </div>
        </div>

        <!-- TAB: HABILIDADES -->
        <div id="habilidades" class="tab-content">
            <div class="panel-grid">
                <!-- Formulario Habilidades -->
                <div class="panel">
                    <h2>📝 Nueva Habilidad</h2>
                    <form id="skillForm">
                        <div class="form-group">
                            <label>Categoría *</label>
                            <input type="text" id="skill-category" placeholder="Ej: Lenguajes de Programación" required>
                        </div>
                        <div class="form-group">
                            <label>Nombre Habilidad *</label>
                            <input type="text" id="skill-name" placeholder="Ej: Python" required>
                        </div>
                        <div class="form-group">
                            <label>Ícono Emoji</label>
                            <input type="text" id="skill-emoji" placeholder="💻" value="💻">
                        </div>
                        <div class="form-group">
                            <label>Imagen</label>
                            <input type="text" id="skill-image" placeholder="/skills/logo.png">
                        </div>
                        <div class="form-group">
                            <label>Nivel (1-5)</label>
                            <input type="number" id="skill-level" min="1" max="5" value="3">
                        </div>
                        <button type="submit" class="btn-primary">➕ Agregar</button>
                        <button type="reset" class="btn-secondary">🔄 Limpiar</button>
                    </form>
                </div>

                <!-- Lista Habilidades -->
                <div class="panel">
                    <h2>💻 Mis Habilidades</h2>
                    <div class="stats-grid" id="skills-stats">
                        <div class="stat-box"><div class="number" id="skills-total">0</div><div class="label">Total</div></div>
                        <div class="stat-box"><div class="number" id="skills-cats">0</div><div class="label">Categorías</div></div>
                    </div>
                    <div class="search-box">
                        <input type="text" placeholder="🔍 Buscar..." onkeyup="filterSkills()">
                    </div>
                    <div class="items-list" id="skills-list"></div>
                </div>
            </div>
        </div>

        <!-- TAB: CERTIFICADOS -->
        <div id="certificados" class="tab-content">
            <div class="panel-grid">
                <!-- Formulario Certificados -->
                <div class="panel">
                    <h2>📝 Nuevo Certificado</h2>
                    <form id="certForm">
                        <div class="form-group">
                            <label>Título *</label>
                            <input type="text" id="cert-title" required>
                        </div>
                        <div class="form-group">
                            <label>Emisor *</label>
                            <input type="text" id="cert-issuer" required>
                        </div>
                        <div class="form-group">
                            <label>Descripción</label>
                            <textarea id="cert-desc"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Año *</label>
                            <input type="number" id="cert-year" value="2024" required>
                        </div>
                        <div class="form-group">
                            <label>Imagen del Certificado</label>
                            <input type="text" id="cert-image" placeholder="/certificates/logo.jpg">
                        </div>
                        <div class="form-group">
                            <label>Logo Emisor</label>
                            <input type="text" id="cert-logo" placeholder="/certificates/logo.jpg">
                        </div>
                        <button type="submit" class="btn-primary">➕ Agregar</button>
                        <button type="reset" class="btn-secondary">🔄 Limpiar</button>
                    </form>
                </div>

                <!-- Lista Certificados -->
                <div class="panel">
                    <h2>🎓 Mis Certificados</h2>
                    <div class="stats-grid" id="certs-stats">
                        <div class="stat-box"><div class="number" id="certs-total">0</div><div class="label">Total</div></div>
                    </div>
                    <div class="search-box">
                        <input type="text" placeholder="🔍 Buscar..." onkeyup="filterCerts()">
                    </div>
                    <div class="items-list" id="certs-list"></div>
                </div>
            </div>
        </div>

        <!-- SECCIÓN DE EXPORTACIÓN GENERAL -->
        <div class="panel" style="margin-top: 30px;">
            <h2>📊 Exportar Datos Completos</h2>
            <div class="export-buttons">
                <button onclick="exportJSON()" class="btn-primary">📋 Descargar JSON</button>
                <button onclick="copyAllJSON()" class="btn-primary">📌 Copiar JSON</button>
            </div>
        </div>
    </div>

    <div class="feedback" id="feedback"></div>

    <script src="admin-console-integrated.js"></script>
</body>
</html>
