        <span class="grow"></span>
        <label class="an-check"><input type="checkbox" data-an="local"${f.local ? ' checked' : ''}> Incluir mis pruebas locales</label>
        <button type="button" class="btn small" data-an="refresh">${ic('refresh')}Actualizar</button></div>`;
}

function anEmpty() {
    return `<div class="an-empty"><b>Todavía no hay datos en este período</b>Los datos aparecen cuando alguien visita el sitio publicado. Prueba con otro período, o activa "Incluir mis pruebas locales" para ver las visitas hechas desde tu computador.</div>`;
}

function anInfo() {
    const i = AN.data && AN.data.info;
    if (!i || !i.total) return '';
    const first = i.first_event ? new Date(i.first_event).toLocaleDateString('es-CL', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
    return `<p class="an-info">Registrando desde el ${esc(first)} · ${fmt(i.total)} eventos guardados${i.local ? ` (${fmt(i.local)} de pruebas locales)` : ''}. Los datos son anónimos: sin cookies ni datos personales.</p>`;
}

function anResumen(d) {
    const k = d.kpi, p = d.prev;
    const kp = (icon, lab, val, sub) => `<div class="an-kpi"><div class="lab"><span class="ico">${ic(icon)}</span>${lab}</div><b>${val}</b><small>${sub || ''}</small></div>`;
    let h = `<div class="an-kpis">
        ${kp('eye', 'Visitas', fmt(k.pageviews), 'páginas vistas ' + delta(k.pageviews, p.pageviews))}
        ${kp('users', 'Sesiones', fmt(k.sessions), fmt(k.visitors) + ' visitantes únicos ' + delta(k.sessions, p.sessions))}
        ${kp('pointer', 'Clics', fmt(k.clicks), fmt1(k.clicks_per_session) + ' por sesión ' + delta(k.clicks, p.clicks))}
        ${kp('target', 'Conversiones', fmt(k.conv_sessions), fmtPct(k.conv_rate) + ' de las sesiones contactó')}
        ${kp('clock', 'Tiempo medio', fmtDur(k.avg_sec), 'activo en cada página')}
        ${kp('scroll', 'Scroll medio', fmt(k.avg_scroll) + '%', 'hasta dónde bajan')}
        ${kp('door', 'Rebote', fmtPct(k.bounce_rate), 'sesiones sin interacción')}
        ${kp('alert', 'Clics muertos', fmt(k.clicks_dead), fmtPct(k.clicks ? k.clicks_dead / k.clicks : 0) + ' de los clics · ' + fmt(k.rage) + ' repetidos')}
    </div>`;

    // serie temporal
    let points;
    if (d.range === 'today') {
        const hmap = {}; d.hourly.forEach(x => { hmap[x.h] = x; });
        const nowH = new Date().getHours();
        points = Array.from({ length: nowH + 1 }, (_, hr) => ({ label: hr + ':00', pageviews: (hmap[hr] || {}).pageviews || 0, clicks: (hmap[hr] || {}).clicks || 0, sessions: 0 }));
    } else {
        const dmap = {}; d.daily.forEach(x => { dmap[x.d] = x; });
        points = [];
        const start = new Date(d.from), end = new Date();
        for (let t = new Date(start); t <= end; t.setDate(t.getDate() + 1)) {
            const key = new Date(t.getTime() - t.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
            const row = dmap[key] || {};
            points.push({ label: key.slice(8) + '/' + key.slice(5, 7), pageviews: row.pageviews || 0, sessions: row.sessions || 0, clicks: row.clicks || 0 });
        }
    }
    const series = [{ key: 'pageviews', name: 'Visitas', color: '#22d3ee' }, { key: 'clicks', name: 'Clics', color: '#7a2cf0' }];
    if (d.range !== 'today') series.splice(1, 0, { key: 'sessions', name: 'Sesiones', color: '#3b82ff' });
    h += `<div class="an-card" style="margin-bottom:16px"><h3><span class="ico">${ic('chart')}</span>Visitas y clics en el tiempo</h3><p class="sub">${d.range === 'today' ? 'Por hora, hoy' : 'Por día'}</p>${legend(series)}${lineChart(points, series)}</div>`;

    // conversiones + dispositivos
    const conv = d.conversions.map(c => ({ label: AN_CONV[c.kind] || c.kind, value: c.clicks, sub: fmt(c.sessions) + ' sesiones' }));
    h += `<div class="an-grid c2">
        <div class="an-card"><h3><span class="ico">${ic('target')}</span>Conversiones: ¿contactan?</h3><p class="sub">Clics en WhatsApp, correo, teléfono y CV</p>${barList(conv)}</div>
        <div class="an-card"><h3><span class="ico">${ic('device')}</span>Dispositivos</h3><p class="sub">Sesiones por tipo de pantalla</p>${donut(d.devices.map(x => ({ label: AN_DEVICE_NAMES[x.device] || x.device, value: x.sessions })), 'sesiones')}</div>
    </div>`;

    // top clics + horas
    const top = d.elements.slice(0, 8).map(e => ({ label: e.label, sub: anPageName(e.page) + ' · ' + e.section, value: e.clicks }));
    const hours = Array.from({ length: 24 }, (_, hr) => ({ label: String(hr).padStart(2, '0') + ':00', pageviews: (d.hourly.find(x => x.h === hr) || {}).pageviews || 0, clicks: (d.hourly.find(x => x.h === hr) || {}).clicks || 0 }));
    h += `<div class="an-grid c2">
        <div class="an-card"><h3><span class="ico">${ic('pointer')}</span>Lo más clicado</h3><p class="sub">Top 8 elementos de todo el sitio</p>${barList(top)}<p style="margin:14px 0 0"><button type="button" class="btn small" data-goto="an-clics">Ver todos los clics ${ic('arrow')}</button></p></div>
        <div class="an-card"><h3><span class="ico">${ic('clock')}</span>¿A qué hora visitan?</h3><p class="sub">Visitas por hora del día (hora de Chile)</p>${lineChart(hours, [{ key: 'pageviews', name: 'Visitas', color: '#22d3ee' }, { key: 'clicks', name: 'Clics', color: '#7a2cf0' }])}</div>
    </div>`;
    return h;
}

function anClics(d) {
    const f = AN.el;
    let rows = d.elements;
    if (f.kind !== 'all') rows = rows.filter(r => r.kind === f.kind);
    if (f.q) rows = rows.filter(r => (r.label + ' ' + r.section + ' ' + anPageName(r.page)).toLowerCase().includes(f.q.toLowerCase()));
    const totalClicks = d.kpi.clicks || 1;
    const kinds = [...new Set(d.elements.map(r => r.kind))];
    const pages = d.pages.map(p => p.page);

    const table = `<div class="an-table-wrap"><table class="an-table"><thead><tr><th>#</th><th>Elemento</th><th>Tipo</th><th>Página</th><th class="num">Clics</th><th class="num">% del total</th><th class="num">Sesiones</th><th></th></tr></thead><tbody>${rows.map((r, i) => {
        const isConv = AN_CONV[r.kind];
        return `<tr><td class="rk">${i + 1}</td><td class="el" title="${esc(r.label)}">${esc(r.label)}<small>${esc(r.section)}</small></td><td><span class="tag ${isConv ? 'conv' : r.interactive ? '' : 'dead'}">${esc(kindName(r.kind))}</span>${r.interactive ? '' : ' <span class="tag dead">sin acción</span>'}</td><td>${esc(anPageName(r.page))}</td><td class="num"><span class="mini-bar" style="width:${Math.max(2, r.clicks / (rows[0] ? rows[0].clicks : 1) * 70)}px"></span>${fmt(r.clicks)}</td><td class="num">${fmt1(r.clicks / totalClicks * 100)}%</td><td class="num">${fmt(r.sessions)}</td><td>${r.ay != null ? `<button type="button" class="btn small" data-an="tomap" data-page="${esc(r.page)}" data-lab="${esc(r.label)}">${ic('pin')}Mapa</button>` : ''}</td></tr>`;
    }).join('') || '<tr><td colspan="8" style="text-align:center;color:var(--dim);padding:26px">Sin resultados con estos filtros.</td></tr>'}</tbody></table></div>`;

    const sectionMap = {};
    d.sections.forEach(s => { const key = s.section + '||' + s.page; sectionMap[key] = s; });
    const secBars = Object.values(sectionMap).sort((a, b) => b.clicks - a.clicks).slice(0, 12).map(s => ({ label: s.section, sub: anPageName(s.page), value: s.clicks }));
    const convPages = d.convByPage.map(c => ({ label: (AN_CONV[c.kind] || c.kind), sub: anPageName(c.page), value: c.clicks }));
    const dead = d.dead.map(x => ({ label: x.label, sub: anPageName(x.page) + ' · ' + x.section, value: x.clicks }));
    const rage = d.rage.map(x => ({ label: x.label, sub: anPageName(x.page), value: x.n }));

    return `<div class="an-card" style="margin-bottom:16px"><h3><span class="ico">${ic('pointer')}</span>Ranking de clics por elemento</h3>
        <p class="sub">Cada fila es un botón, enlace, imagen o texto en el que alguien hizo clic. "Mapa" te lleva al lugar exacto en el mapa de calor.</p>
        <div class="an-toolbar" style="margin-bottom:12px">
            <div class="chips"><button type="button" class="chip ${f.kind === 'all' ? 'on' : ''}" data-an="kind" data-v="all">Todos</button>${kinds.map(k => `<button type="button" class="chip ${f.kind === k ? 'on' : ''}" data-an="kind" data-v="${esc(k)}">${esc(kindName(k))}</button>`).join('')}</div>
            <span class="grow"></span>
            <select data-an="page" aria-label="Página"><option value="all">Todas las páginas</option>${pages.map(p => `<option value="${esc(p)}"${AN.filters.page === p ? ' selected' : ''}>${esc(anPageName(p))}</option>`).join('')}</select>
            <input type="text" class="an-search" data-an="q" placeholder="Buscar elemento…" value="${esc(f.q)}"></div>
        ${table}</div>
        <div class="an-grid c2">
            <div class="an-card"><h3><span class="ico">${ic('layers')}</span>Clics por sección</h3><p class="sub">Qué zonas de cada página concentran la atención</p>${barList(secBars)}</div>
            <div class="an-card"><h3><span class="ico">${ic('target')}</span>Conversiones por página</h3><p class="sub">Desde qué página contactan</p>${barList(convPages)}</div>
            <div class="an-card"><h3><span class="ico">${ic('alert')}</span>Clics muertos</h3><p class="sub">Elementos en los que hacen clic pero no hacen nada. Si algo aparece mucho aquí, la gente espera que sea un botón o enlace.</p>${barList(dead)}</div>
            <div class="an-card"><h3><span class="ico">${ic('bolt')}</span>Clics repetidos (frustración)</h3><p class="sub">3 o más clics seguidos en el mismo punto: algo no responde como se espera.</p>${barList(rage)}</div>
        </div>`;
}

function anPaginas(d) {
    const total = d.kpi.pageviews || 1;
    const flows = d.flows.map(f => `<div class="row"><div class="path"><span>${esc(anPageName(f.prev))}</span>${ic('arrow')}<span>${esc(anPageName(f.page))}</span></div><b>${fmt(f.n)}</b></div>`).join('') || '<p class="sub" style="margin:0">Sin recorridos todavía.</p>';
    const cards = d.pages.map(p => {
        const base = p.leaves || 1;
        const fun = [['25%', p.r25], ['50%', p.r50], ['75%', p.r75], ['Final', p.r100]].map(([l, v]) => `<div class="f"><span>${l}</span><div class="tr"><span style="width:${v / base * 100}%"></span></div><b>${fmt(v / base * 100)}%</b></div>`).join('');
        const tops = d.elements.filter(e => e.page === p.page).slice(0, 4);
        return `<div class="an-card page-card"><h3><span class="ico">${ic('layers')}</span>${esc(anPageName(p.page))}<span class="tag" style="margin-left:auto">${fmt1(p.views / total * 100)}% de las visitas</span></h3>
            <div class="stats"><div><b>${fmt(p.views)}</b><span>Visitas</span></div><div><b>${fmt(p.sessions)}</b><span>Sesiones</span></div><div><b>${fmt(p.clicks)}</b><span>Clics</span></div><div><b>${fmt1(p.views ? p.clicks / p.views : 0)}</b><span>Clics por visita</span></div><div><b>${fmtDur(p.avg_sec)}</b><span>Tiempo medio</span></div><div><b>${fmt(p.conv)}</b><span>Conversiones</span></div></div>
            <div><p class="sub" style="margin:0 0 8px">Cuánto de la página llegan a ver (scroll)</p><div class="funnel">${fun}</div></div>
            ${tops.length ? `<div><p class="sub" style="margin:0 0 8px">Lo más clicado aquí</p>${barList(tops.map(e => ({ label: e.label, sub: e.section, value: e.clicks })))}</div>` : ''}
            <button type="button" class="btn small" data-an="tomap" data-page="${esc(p.page)}" style="justify-self:start">${ic('pin')}Ver mapa de calor</button></div>`;
    }).join('');
    return `<div class="an-grid c2">${cards || ''}</div>
        <div class="an-card"><h3><span class="ico">${ic('route')}</span>Recorridos entre páginas</h3><p class="sub">Cómo se mueven los visitantes de una página a otra</p><div class="an-flow">${flows}</div></div>`;
}

function anAudiencia(d) {
    const countries = d.countries.map(c => ({ label: countryName(c.country), value: c.sessions }));
    const refs = d.referrers.map(r => ({ label: r.ref, value: r.sessions }));
    return `<div class="an-grid c2">
        <div class="an-card"><h3><span class="ico">${ic('device')}</span>Tipo de dispositivo</h3>${donut(d.devices.map(x => ({ label: AN_DEVICE_NAMES[x.device] || x.device, value: x.sessions })), 'sesiones')}</div>
        <div class="an-card"><h3><span class="ico">${ic('globe')}</span>Países</h3><p class="sub">Desde dónde visitan</p>${barList(countries)}</div>
        <div class="an-card"><h3><span class="ico">${ic('route')}</span>¿De dónde llegan?</h3><p class="sub">Sitios que los enviaron a tu portafolio</p>${barList(refs)}</div>
        <div class="an-card"><h3><span class="ico">${ic('cpu')}</span>Navegadores y sistemas</h3>${barList(d.browsers.map(b => ({ label: b.browser, value: b.sessions })))}<div style="height:16px"></div>${barList(d.os.map(b => ({ label: b.os, value: b.sessions })))}</div>
    </div>
    <div class="an-card"><h3><span class="ico">${ic('clock')}</span>Cuándo te visitan</h3><p class="sub">Visitas por día de la semana y hora (hora de Chile). Más oscuro = más visitas.</p>${heatGrid(d.dow)}</div>`;
}

function anVivo(d) {
    const now = Date.now();
    const rel = (t) => { const s = Math.round((now - new Date(t)) / 1000); return s < 60 ? 'hace ' + s + ' s' : s < 3600 ? 'hace ' + Math.round(s / 60) + ' min' : s < 86400 ? 'hace ' + Math.round(s / 3600) + ' h' : new Date(t).toLocaleDateString('es-CL'); };
    const rows = d.recent.map(e => `<tr><td>${rel(e.ts)}</td><td><span class="tag ${e.type === 'click' ? '' : e.type === 'pageview' ? 'warn' : 'dead'}">${e.type === 'click' ? 'Clic' : e.type === 'pageview' ? 'Visita' : 'Salió'}</span></td><td>${esc(anPageName(e.page))}</td><td class="el">${esc(e.label || '')}${e.kind ? `<small>${esc(kindName(e.kind))}</small>` : ''}</td><td>${esc(AN_DEVICE_NAMES[e.device] || e.device || '')}</td><td>${esc(countryName(e.country) || '—')}</td></tr>`).join('');
    const recent5 = d.recent.filter(e => now - new Date(e.ts) < 5 * 60000);
    const active = new Set(recent5.map(e => e.page + e.device)).size;
    return `<div class="an-kpis"><div class="an-kpi"><div class="lab"><span class="ico">${ic('bolt')}</span>Últimos 5 minutos</div><b>${fmt(recent5.length)}</b><small>eventos${active ? ' · ' + active + ' pantallas activas' : ''}</small></div></div>
        <div class="an-card"><h3><span class="ico">${ic('eye')}</span>Actividad reciente</h3><p class="sub">Se actualiza sola cada 10 segundos</p><div class="an-table-wrap"><table class="an-table"><thead><tr><th>Cuándo</th><th>Evento</th><th>Página</th><th>Elemento</th><th>Dispositivo</th><th>País</th></tr></thead><tbody>${rows || '<tr><td colspan="6" style="text-align:center;color:var(--dim);padding:26px">Todavía no hay actividad.</td></tr>'}</tbody></table></div></div>`;
}

/* ---------- Mapa de calor ---------- */
function anMapa() {
    const h = AN.heat;
    const pages = (AN.data ? AN.data.pages.map(p => p.page) : []);
    ['inicio', 'proyectos', 'trayectoria', 'habilidades', 'contacto'].forEach(p => { if (!pages.includes(p)) pages.push(p); });
    return `<div class="hm-layout"><div><div class="hm-frame" id="hm-frame" style="height:520px"><div class="hm-loading" id="hm-loading">Cargando mapa…</div></div>
        <p class="an-info" style="margin:10px 0 0" id="hm-note"></p></div>
        <div class="an-card hm-controls"><h3><span class="ico">${ic('flame')}</span>Mapa de calor</h3>
            <label class="ctl">Página<select data-an="hmpage">${pages.map(p => `<option value="${esc(p)}"${h.page === p ? ' selected' : ''}>${esc(anPageName(p))}</option>`).join('')}</select></label>
            <label class="ctl">Dispositivo<select data-an="hmdevice">${['desktop', 'tablet', 'mobile'].map(v => `<option value="${v}"${h.device === v ? ' selected' : ''}>${AN_DEVICE_NAMES[v]}</option>`).join('')}</select></label>
            <label class="ctl">Qué mostrar<select data-an="hmmode"><option value="clicks"${h.mode === 'clicks' ? ' selected' : ''}>Clics</option><option value="scroll"${h.mode === 'scroll' ? ' selected' : ''}>Hasta dónde bajan (scroll)</option><option value="both"${h.mode === 'both' ? ' selected' : ''}>Ambos</option></select></label>
            <label class="ctl">Tamaño de la mancha <input type="range" min="16" max="90" value="${h.radius}" data-an="hmradius"></label>
            <label class="ctl">Intensidad <input type="range" min="30" max="100" value="${h.opacity}" data-an="hmopacity"></label>
            <label class="an-check"><input type="checkbox" data-an="hmmarkers"${h.markers ? ' checked' : ''}> Numerar lo más clicado</label>
            <div><div class="hm-scale"></div><div class="hm-legend"><span>pocos clics</span><span>muchos</span></div></div>
            <div id="hm-list"></div></div></div>`;
}

function heatLUT() {
    const c = document.createElement('canvas'); c.width = 256; c.height = 1;
    const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 256, 0);
    gr.addColorStop(0, 'rgba(34,229,255,0)'); gr.addColorStop(0.12, 'rgba(34,229,255,0.55)'); gr.addColorStop(0.38, 'rgba(59,130,255,0.85)');
    gr.addColorStop(0.65, 'rgba(122,44,240,0.95)'); gr.addColorStop(0.85, 'rgba(190,150,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,1)');
    g.fillStyle = gr; g.fillRect(0, 0, 256, 1);
    return g.getImageData(0, 0, 256, 1).data;
}

function anHeatSite() { return location.hostname === 'localhost' ? 'http://localhost:5174' : SITE_URL; }

function anDrawHeat() {
    const frame = document.getElementById('hm-frame');
    if (!frame) return;
    const h = AN.heat, d = h.data;
    const loading = document.getElementById('hm-loading');
    if (loading) loading.style.display = (h.loading || !d) ? 'grid' : 'none';
    if (!d) return;

    const devW = h.device === 'mobile' ? Math.min(430, Math.max(360, d.meta.vw || 390)) : h.device === 'tablet' ? Math.min(1000, Math.max(700, d.meta.vw || 820)) : Math.min(1920, Math.max(1100, d.meta.vw || 1366));
    const docH = Math.max(900, Math.min(24000, d.meta.doc_h || 3000));
    const s = frame.clientWidth / devW;
    frame.style.height = Math.round(docH * s) + 'px';
    const key = [AN.heat.page, devW, docH].join('|');
    let stage = frame.querySelector('.hm-stage');
    if (!stage || stage.dataset.key !== key) {
        frame.querySelector('.hm-stage')?.remove();
        stage = document.createElement('div');
        stage.className = 'hm-stage';
        stage.dataset.key = key;
        stage.style.cssText = `width:${devW}px;height:${docH}px`;
        const route = AN.heat.page === 'inicio' ? '#home' : '#' + AN.heat.page;
        stage.innerHTML = `<iframe src="${anHeatSite()}/?heatmap=1${route}" width="${devW}" height="${docH}" title="Vista de la página"></iframe>`;
        frame.appendChild(stage);
    }
    stage.style.transform = `scale(${s})`;
    stage.style.setProperty('--sc', s);
    [...stage.children].forEach((n) => { if (n.tagName !== 'IFRAME') n.remove(); });

    const cells = d.cells.filter(c => !c.fixed);
    const maxN = Math.max(1, ...cells.map(c => c.n));
    const total = d.meta.clicks || 0;

    if ((h.mode === 'clicks' || h.mode === 'both') && cells.length) {
        const K = 0.5;
        const cv = document.createElement('canvas');
        cv.width = Math.round(devW * K); cv.height = Math.round(docH * K);
        cv.style.width = devW + 'px'; cv.style.height = docH + 'px';
        const ctx = cv.getContext('2d', { willReadFrequently: true });
        const r = h.radius * K;
        cells.forEach(c => {
            const x = (c.bx / 100) * devW * K, y = (c.by * 20 + 10) * K;
            const a = Math.min(1, 0.22 + 0.78 * Math.pow(c.n / maxN, 0.75));
            const g = ctx.createRadialGradient(x, y, 0, x, y, r);
            g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
        });
        const img = ctx.getImageData(0, 0, cv.width, cv.height), px = img.data, lut = heatLUT(), op = h.opacity / 100;
        for (let i = 0; i < px.length; i += 4) {
            const al = px[i + 3];
            if (!al) continue;
            const j = Math.min(255, al) * 4;
            px[i] = lut[j]; px[i + 1] = lut[j + 1]; px[i + 2] = lut[j + 2]; px[i + 3] = lut[j + 3] * op;
        }
        ctx.putImageData(img, 0, 0);
        stage.appendChild(cv);
    }

    if ((h.mode === 'scroll' || h.mode === 'both') && d.reach && d.reach.total) {
        const t = d.reach.total;
        for (let i = 0; i < 10; i++) {
            const frac = i === 0 ? 1 : (d.reach[`d${i * 10}`] || 0) / t;
            const band = document.createElement('div');
            band.className = 'hm-band';
            band.style.top = (i * 10) + '%'; band.style.height = '10%';
            band.style.opacity = String(Math.min(0.6, (1 - frac) * 0.65));
            const lab = document.createElement('div');
            lab.style.cssText = `position:absolute;right:0;top:${i * 10}%;height:10%;pointer-events:none`;
            lab.innerHTML = `<span style="font:800 ${14 / s}px DM Sans;color:#fff;background:rgba(5,9,42,.78);padding:2px 10px;border-radius:0 0 0 8px;display:inline-block">${fmt(frac * 100)}% llega aquí</span>`;
            stage.appendChild(band); stage.appendChild(lab);
        }
    }

    const marks = AN.data ? AN.data.elements.filter(e => e.page === h.page && e.ay != null).slice(0, 10) : [];
    if (h.markers) marks.forEach((m, i) => {
        const el = document.createElement('div');
        el.className = 'hm-mark' + (h.sel && h.sel === m.label ? ' sel' : '');
        el.style.left = m.ax + '%'; el.style.top = m.ay + 'px'; el.textContent = i + 1; el.title = `${m.label} · ${m.clicks} clics`;
        stage.appendChild(el);
    });

    const list = document.getElementById('hm-list');
    if (list) list.innerHTML = marks.length ? `<p class="sub" style="margin:0 0 8px">Lo más clicado en esta página</p>${marks.map((m, i) => `<div class="bar-row" style="grid-template-columns:26px minmax(0,1fr) auto;margin-bottom:7px"><b style="color:var(--accent)">${i + 1}</b><div class="nm" title="${esc(m.label)}">${esc(m.label)}<small>${esc(m.section)}</small></div><div class="vl">${fmt(m.clicks)}</div></div>`).join('')}` : '';
    const fixedClicks = d.cells.filter(c => c.fixed).reduce((a, c) => a + c.n, 0);
    const note = document.getElementById('hm-note');
    if (note) note.textContent = `${fmt(d.meta.views)} visitas · ${fmt(total)} clics en esta página (${AN_DEVICE_NAMES[h.device]})${fixedClicks ? ` · ${fmt(fixedClicks)} clics en el menú y botones flotantes no se dibujan aquí` : ''}.${total ? '' : ' Todavía no hay clics registrados para este filtro.'}`;
}

/* ---------- Pintado de la sección ---------- */
function anRender() {
    const body = document.getElementById('an-body');
    if (!body) return;
    const page = pageById(currentPage);
    clearInterval(AN.timer); AN.timer = null;

    if (page.custom === 'an-mapa') {
        body.innerHTML = anMapa();
        anLoadHeat(!AN.heat.data);
        if (!AN.data && !AN.loading) anLoad();
        return;
    }
    if (AN.loading && !AN.data) { body.innerHTML = '<div class="an-skel"></div><div class="an-skel"></div><div class="an-skel"></div>'; return; }
    if (AN.error) { body.innerHTML = `<div class="an-empty"><b>No se pudo cargar la analítica</b>${esc(AN.error)}<br><br><button type="button" class="btn primary" data-an="refresh">Reintentar</button></div>`; return; }
    const d = AN.data;
    if (!d) return;
    const empty = !d.kpi.pageviews && !d.kpi.clicks;
    const info = anInfo();
    if (page.custom === 'an-vivo') {
        body.innerHTML = info + anVivo(d);
        AN.timer = setInterval(() => { if (document.getElementById('an-body') && pageById(currentPage).custom === 'an-vivo') anLoad(true); else clearInterval(AN.timer); }, 10000);
        return;
    }
    if (empty) { body.innerHTML = info + anEmpty(); return; }
    body.innerHTML = info + ({ 'an-resumen': anResumen, 'an-clics': anClics, 'an-paginas': anPaginas, 'an-audiencia': anAudiencia })[page.custom](d) + `<div class="an-grid" style="margin-top:6px"><div class="an-card"><h3><span class="ico">${ic('shield')}</span>Privacidad y tus propias visitas</h3><p class="sub">Los datos son anónimos (sin cookies ni información personal). Para que tus visitas no cuenten, abre el sitio una vez en cada navegador que uses:</p><div class="img-actions"><a class="btn small primary" href="${SITE_URL}/?notrack=1" target="_blank" rel="noopener">${ic('shield')}No contar mis visitas en este navegador</a><a class="btn small" href="${SITE_URL}/?notrack=0" target="_blank" rel="noopener">Volver a contarlas</a>${d.info && d.info.local ? `<button type="button" class="btn small danger" data-an="purge">${ic('trash')}Borrar pruebas locales (${fmt(d.info.local)})</button>` : ''}</div></div></div>`;
}

function analyticsShell(page, tabs) {
    const meta = MODULE_META['Analítica'] || {};
    return `<div class="page-hero"><div class="hero-ico">${ic(meta.icon || 'chart')}</div><p>${esc(page.desc)}</p></div>${tabs}${anToolbar(page)}<div id="an-body"></div>`;
}

/* ---------- Eventos ---------- */
document.getElementById('page').addEventListener('click', (e) => {
    const b = e.target.closest('[data-an]');
    if (!b) return;
    const a = b.dataset.an;
    if (a === 'range') { AN.filters.range = b.dataset.v; AN.data = null; AN.heat.data = null; renderPage(); anLoad(); }
    else if (a === 'refresh') { AN.heat.data = null; anLoad(true); }
    else if (a === 'kind') { AN.el.kind = b.dataset.v; anRender(); }
    else if (a === 'tomap') { AN.heat.page = b.dataset.page; AN.heat.sel = b.dataset.lab || null; AN.heat.data = null; goPage('an-mapa'); }
    else if (a === 'purge') {
        if (!confirm('¿Borrar todos los eventos registrados desde localhost (tus pruebas)? Los de visitantes reales no se tocan.')) return;
        fetch('/api/analytics?scope=local', { method: 'DELETE' }).then(r => r.json()).then(j => { toast('Se borraron ' + (j.removed || 0) + ' eventos de prueba'); AN.data = null; AN.heat.data = null; anLoad(true); });
    }
});
document.getElementById('page').addEventListener('change', (e) => {
    const t = e.target.closest('[data-an]');
    if (!t) return;
    const a = t.dataset.an;
    if (a === 'device') { AN.filters.device = t.value; AN.data = null; anLoad(); }
    else if (a === 'local') { AN.filters.local = t.checked; AN.data = null; AN.heat.data = null; anLoad(); }
    else if (a === 'page') { AN.filters.page = t.value; AN.data = null; anLoad(); }
    else if (a === 'hmpage') { AN.heat.page = t.value; AN.heat.sel = null; anLoadHeat(); }
    else if (a === 'hmdevice') { AN.heat.device = t.value; anLoadHeat(); }
    else if (a === 'hmmode') { AN.heat.mode = t.value; anDrawHeat(); }
    else if (a === 'hmmarkers') { AN.heat.markers = t.checked; anDrawHeat(); }
});
document.getElementById('page').addEventListener('input', (e) => {
    const t = e.target.closest('[data-an]');
    if (!t) return;
    if (t.dataset.an === 'q') { AN.el.q = t.value; const pos = t.selectionStart; anRender(); const n = document.querySelector('[data-an="q"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
    else if (t.dataset.an === 'hmradius') { AN.heat.radius = Number(t.value); anDrawHeat(); }
    else if (t.dataset.an === 'hmopacity') { AN.heat.opacity = Number(t.value); anDrawHeat(); }
});
window.addEventListener('resize', () => { if (pageById(currentPage).custom === 'an-mapa' && AN.heat.data) anDrawHeat(); });

checkSession();
</script>
</body>
</html>
